name: iOS release audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        type: choice
        options: [full, audit, deletion, regression, push-recovery]
        default: full

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: inputs.scope != 'deletion'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated project and audit
        run: |
          python3 scripts/generate_xcode_project.py --check
          python3 scripts/verify_audit.py
          python3 scripts/verify_foundation.py
          python3 scripts/verify_contrast.py --report artifacts/contrast-verification.json
          python3 scripts/verify_release.py --report artifacts/source-release-verification.json
      - name: Unit tests on host
        run: swift test --package-path Packages/MeetSpaceKit
      - name: Unsigned device Release archive
        run: xcodebuild -project MeetSpace.xcodeproj -scheme MeetSpace-Release -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/MeetSpace-Unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Verify actual device product
        run: python3 scripts/verify_release.py --archive artifacts/MeetSpace-Unsigned.xcarchive --report artifacts/release-verification.json
      - name: Upload archive and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: artifacts/
          retention-days: 7
  simulators:
    # Intel CI14 hit XCTest AX initialization and audit-engine timeouts.
    # Recheck on Apple's native architecture; keep the runtime/device matrix intact.
    runs-on: macos-15
    # CI10 iPad26 reached the 55m limit with eight tests remaining; preserve the full matrix.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {family: iPhone, runtime: 26, label: iPhone26, scope: full, device: 'iPhone 17 Pro Max'}
          - {family: iPad, runtime: 26, label: iPad26, scope: full, device: 'iPad Pro 13-inch (M5)'}
          - {family: iPhone, runtime: 18, label: iPhone18, scope: compatibility, device: 'iPhone SE (3rd generation)'}
          - {family: iPad, runtime: 18, label: iPad18, scope: compatibility, device: 'iPad mini (A17 Pro)'}
    steps:
      - uses: actions/checkout@v4
      - name: Device inventory
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: App, Keychain and UI tests
        # Audit diagnosis covers two devices; deletion/regression/full use all four.
        if: inputs.scope != 'audit' || matrix.label == 'iPhone18' || matrix.label == 'iPad26'
        run: python3 scripts/ci_simulators.py --family '${{ matrix.family }}' --runtime-major '${{ matrix.runtime }}' --label '${{ matrix.label }}' --preferred-device '${{ matrix.device }}' --scope '${{ inputs.scope == 'audit' && 'audit' || inputs.scope == 'deletion' && 'deletion' || inputs.scope == 'regression' && 'regression' || inputs.scope == 'push-recovery' && 'push-recovery' || matrix.scope }}'
      - name: Diagnostic Instruments baseline (reported separately)
        if: always() && matrix.label == 'iPhone18' && inputs.scope != 'deletion' && inputs.scope != 'push-recovery'
        # Profiling capability is a separate gate. Preserve its exact failure/blocker
        # in receipt.json; it must never replace the native test result above.
        continue-on-error: true
        run: |
          meetspace_profile_udid=$(python3 -c 'import json; print(json.load(open("artifacts/iPhone18-environment.json"))["udid"])')
          python3 scripts/profile_simulator.py --simulator "$meetspace_profile_udid" --test-summary artifacts/iPhone18-summary.json --boot-if-needed --output artifacts/iPhone18-profiling
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.label }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
